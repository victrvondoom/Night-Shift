[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon"
version = "0.7.0"
description = "Night Shift: the on-call agent that fixes the 3 AM page with your voice, and does not wake you the second time"
authors = [{ name = "Prashant", email = "prashant101007@gmail.com" }]
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi",
    "httpx",
    "kubernetes",
    "litellm",
    "minio",
    "nats-py",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-sdk",
    "prometheus-client",
    "psycopg[binary]",
    "psycopg-pool",
    "pydantic",
    "pyyaml",
    "temporalio",
    "uvicorn",
]

[project.optional-dependencies]
# Semantic log reduction (Cordon). Heavy: installs PyTorch.
reduce = ["cordon"]
dev = [
    "pytest",
    "pytest-mock",
    "mypy",
    "types-PyYAML",
    "ruff>=0.17.4",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beacon = ["prompts/*.txt", "py.typed"]

[tool.mypy]
strict = true
packages = ["beacon"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "cordon", "cordon.*", "litellm", "litellm.*",
    "kubernetes", "kubernetes.*", "nats", "nats.*", "minio", "minio.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a live cluster (make up) and KUBECONFIG"]
