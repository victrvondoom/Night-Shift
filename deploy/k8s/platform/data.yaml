# Data plane: PostgreSQL (JSONB ledgers + Temporal), NATS JetStream, MinIO, Vault.
apiVersion: v1
kind: Namespace
metadata:
  name: beacon
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: beacon}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: beacon}
            - {name: POSTGRES_DB, value: beacon}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: beacon-bootstrap, key: POSTGRES_PASSWORD}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, beacon]}
            periodSeconds: 3
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: beacon}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: nats, namespace: beacon}
spec:
  replicas: 1
  selector: {matchLabels: {app: nats}}
  template:
    metadata: {labels: {app: nats}}
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports: [{containerPort: 4222}, {containerPort: 8222}]
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: nats, namespace: beacon}
spec:
  selector: {app: nats}
  ports: [{name: client, port: 4222}, {name: monitor, port: 8222}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: minio, namespace: beacon}
spec:
  replicas: 1
  selector: {matchLabels: {app: minio}}
  template:
    metadata: {labels: {app: minio}}
    spec:
      containers:
        - name: minio
          image: pgsty/minio:latest  # community build; minio/minio is no longer on Docker Hub
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - {name: MINIO_ROOT_USER, value: beacon}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: beacon-bootstrap, key: MINIO_SECRET_KEY}}
          ports: [{containerPort: 9000}, {containerPort: 9001}]
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: minio, namespace: beacon}
spec:
  selector: {app: minio}
  ports: [{name: s3, port: 9000}, {name: console, port: 9001}]
---
# Vault in dev mode: fine for a laptop, not for production (in-memory, root token).
# Production: a real Vault with Kubernetes auth; set VAULT_K8S_ROLE instead of VAULT_TOKEN.
apiVersion: apps/v1
kind: Deployment
metadata: {name: vault, namespace: beacon}
spec:
  replicas: 1
  selector: {matchLabels: {app: vault}}
  template:
    metadata: {labels: {app: vault}}
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.17
          args: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom: {secretKeyRef: {name: beacon-bootstrap, key: VAULT_TOKEN}}
          ports: [{containerPort: 8200}]
          readinessProbe:
            httpGet: {path: /v1/sys/health, port: 8200}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: vault, namespace: beacon}
spec:
  selector: {app: vault}
  ports: [{port: 8200}]
---
# Copies the application secrets from the bootstrap Secret into Vault KV v2
# (secret/beacon). After this, Night Shift reads them from Vault, not from env.
apiVersion: batch/v1
kind: Job
metadata: {name: vault-seed, namespace: beacon}
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: hashicorp/vault:1.17
          env:
            - {name: VAULT_ADDR, value: "http://vault:8200"}
            - name: VAULT_TOKEN
              valueFrom: {secretKeyRef: {name: beacon-bootstrap, key: VAULT_TOKEN}}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cd /app-secrets
              args=""
              for f in *; do args="$args $f=@$f"; done
              vault kv put secret/beacon $args >/dev/null
              echo "seeded $(ls | wc -l) secrets into secret/beacon"
          volumeMounts: [{name: app, mountPath: /app-secrets}]
      volumes:
        - name: app
          secret: {secretName: beacon-app-secrets}
