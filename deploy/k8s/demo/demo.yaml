apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-db
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: demo-db}
  template:
    metadata:
      labels: {app: demo-db}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata:
  name: demo-db
  namespace: demo
spec:
  selector: {app: demo-db}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-db-ingress
  namespace: demo
spec:
  podSelector:
    matchLabels: {app: demo-db}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: demo-api}
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: demo
spec:
  replicas: 1
  progressDeadlineSeconds: 60
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: demo-api}
  template:
    metadata:
      labels: {app: demo-api}
    spec:
      containers:
        - name: api
          image: beacon-demo:local
          imagePullPolicy: IfNotPresent
          env:
            - {name: APP_VERSION, value: v1}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: demo
spec:
  selector: {app: demo-api}
  ports: [{port: 8080, targetPort: 8080}]
