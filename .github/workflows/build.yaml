name: build
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: beacon, POSTGRES_PASSWORD: beacon, POSTGRES_DB: beacon}
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U beacon" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: docker run -d -p 8281:8181 -v $PWD/policy:/policy:ro openpolicyagent/opa:1.0.0 run --server --addr=0.0.0.0:8181 /policy
      - run: pip install -e '.[dev,reduce]'
      - run: ruff check src tests scripts
      - run: pytest tests -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: cd web && npm ci && npm run build
